<html>
    <head>
        <title>9-22-26</title>
    </head>

    <style>
        #root {
            background-color: red;
        }

        .pokemonData {
            display: flex;
        }
    </style>

    <body>
        <div id="root"></div>
        <script>
            // Pokemon Data
            let allPokemon = []
            let pokemon = {}
            pokemon.name = "pikachu"
            pokemon.description = "lightning rat"
            pokemon.img = "https://img.pokemondb.net/sprites/ruby-sapphire/normal/pikachu.png"
            allPokemon.push(pokemon);

            allPokemon.push({
                name: "tinkaton",
                description: "little guy big hammer",
                img: "https://img.pokemondb.net/sprites/scarlet-violet/normal/tinkaton.png"
            });

            function addPokemonToRoot(pokemon){
                // 1. Get the root div
                let rootDiv = document.querySelector("#root");

                let pokemonDiv = document.createElement("div");

                let infoDiv = document.createElement("div");

                let nameHeading = document.createElement("h1");
                nameHeading.innerHTML = pokemon.name;
                pokemonDiv.append(nameHeading);

                let descriptionParagraph = document.createElement("p")
                descriptionParagraph.innerHTML = pokemon.description;
                pokemonDiv.append(descriptionParagraph);

                let imageElement = document.createElement("img");
                imageElement.src = pokemon.img;
                pokemonDiv.append(imageElement);

                pokemonDiv.append(infoDiv);
                rootDiv.append(pokemonDiv);


            }

            addPokemonToRoot(allPokemon[1]);

        </script>
    </body>
</html>
